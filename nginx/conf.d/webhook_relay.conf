server {
    listen 81;
    client_max_body_size 0;

    # DNS used to look up the ngrok hostnames in proxy_pass at request time.
    # Public resolvers only: 127.0.0.11 is Docker Compose's DNS and doesn't exist on Render/Railway.
    resolver 8.8.8.8 1.1.1.1 valid=30s;

    include /etc/nginx/webhooks/*.conf;

    # used by webhook endpoints to return a 2xx after mirroring
    location = /_respond_ok {
        return 202 'Accepted';
        add_header Content-Type text/plain;
    }

    # Catch-all
    location / {
        return 404 'Unknown webhook endpoint';
        add_header Content-Type text/plain;
    }
}
