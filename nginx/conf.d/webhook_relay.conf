server {
    listen 81;

    # props to cursor idk what this does
    # DNS resolver for proxying to external hostnames (Docker's internal DNS + Google fallback)
    resolver 127.0.0.11 8.8.8.8 valid=30s;

    include /etc/nginx/webhooks/*.conf;

    # used by webhook endpoints to return a 2xx after mirroring
    location = /_respond_ok {
        return 202 'Accepted';
        add_header Content-Type text/plain;
    }

    # Catch-all
    location / {
        return 404 'Unknown webhook endpoint';
        add_header Content-Type text/plain;
    }
}
