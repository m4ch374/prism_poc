# Henry
location = /_mirror_henry {
    internal;
    proxy_pass https://partially-winning-oyster.ngrok-free.app$request_uri;
    proxy_set_header Host partially-winning-oyster.ngrok-free.app;
    proxy_ssl_server_name on;
    proxy_pass_request_body on;
    proxy_set_header Content-Length $content_length;
}
