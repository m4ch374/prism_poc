# Route: /api/v1/ai/email-frontdoor
# Fans out to: henry, grace, vince

location = /api/v1/ai/email-frontdoor {
    mirror /_mirror_henry;
    mirror /_mirror_grace;
    mirror /_mirror_vince;
    mirror_request_body on;
    
    # Proxy to internal responder (required for mirror to work)
    proxy_pass http://127.0.0.1:81/_respond_ok;
}
